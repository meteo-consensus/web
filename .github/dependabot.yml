# Routine updates. Cooldown: a release is proposed only after it has been public for a
# while (same rule as pnpm minimumReleaseAge); security updates are never delayed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7
      semver-major-days: 30
    labels:
      - type:chore
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    cooldown:
      default-days: 7
    labels:
      - type:chore
      - area:ci
