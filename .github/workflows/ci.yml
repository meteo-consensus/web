# Same checks as `pnpm run check`, from the org's reusable workflow. The required status
# check on main is "ci / CI".
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    uses: meteo-consensus/.github/.github/workflows/node-ci.yml@62883f3d2d53c3c756fbcdb3c0888bfebc0656a3 # main, untagged (09/11/2026)
    permissions:
      contents: read
      packages: read
