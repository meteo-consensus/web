# Same checks as `pnpm run check`, from the org's reusable workflow. The required status
# check on main is "ci / CI".
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    uses: meteo-consensus/.github/.github/workflows/node-ci.yml@5f4bc58cc4bcc0bea74123dd39cbc54235c380e7 # v0.1.3 (tag checked 12/11/2026)
    permissions:
      contents: read
      packages: read
