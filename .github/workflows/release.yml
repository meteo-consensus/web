# Release PRs, tags and CHANGELOG.md from Conventional Commits (release-please).
# This repo ships no package: it calls the reusable `release.yml` only, without the
# `publish.yml` job, so it never grants `packages: write` (meteo-consensus/.github#11).
name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    uses: meteo-consensus/.github/.github/workflows/release.yml@5f4bc58cc4bcc0bea74123dd39cbc54235c380e7 # v0.1.3 (tag checked 12/11/2026)
    permissions:
      contents: write
      pull-requests: write
