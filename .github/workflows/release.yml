# Release PRs, tags and CHANGELOG.md from Conventional Commits (release-please).
# Set `publish: true` only in repos that ship an npm package (contracts, db).
name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    uses: meteo-consensus/.github/.github/workflows/release.yml@62883f3d2d53c3c756fbcdb3c0888bfebc0656a3 # main, untagged (09/11/2026)
    with:
      publish: false
    permissions:
      contents: write
      pull-requests: write
      packages: write
